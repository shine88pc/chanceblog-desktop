name: "Package — 개인 PC 제한 시험용 빌드(수동)"

# 개인 PC 제한 시험용, 미서명 Package 를 GitHub 의 Windows 러너에서 만든다(운영자 2026-11-11 결정 7·8·9항, docs/PACKAGE.md).
# 수동 실행(workflow_dispatch)만이다 — 푸시·PR·예약 실행으로는 돌지 않고, 입력칸도 없다(글을 받아 명령에 넣는 길이 없다).
# 읽기 권한만 쓰고(permissions: contents: read) 비밀 값(secrets.*)·토큰을 쓰지 않으며 서명 단계가 없다(미서명 Package).
# 올리는 것은 압축 파일·SHA256SUMS·PACKAGE_INFO.md·PACKAGE_INFO.json 넷뿐이다(보존 14일) — 빌드 로그·work·spec·데이터 폴더·시험 로그는 올리지 않는다.
# 빌드 스크립트는 작업 트리가 깨끗하지 않거나 설치된 도구가 잠금 파일과 다르면, 묶음의 자가 점검(--selftest)이 하나라도 실패하면, 외부 쓰기 관문(capabilities)이 없으면 아무것도 만들지 않고 실패한다.
#   --allow-missing-gate(시험 빌드 옵션)는 여기서 쓰지 않는다.
# 액션은 전체 커밋 SHA 로 고정한다(docs/SECURITY.md §4, 시험이 지킨다).
# T3(.github 변경) — 운영자 승인 전에는 병합하지 않는다.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 시험용 Package 만들기 (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      # checkout·setup-python 의 SHA 와 오른쪽 버전 표기는 ci.yml 의 같은 줄과 같은 값이다 — 표기(v4.4.0 등)가 공식 릴리스 이름과 맞는지는 확인 못 함(승인 때 ci.yml 까지 함께 공식 값과 대조한다).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: 잠금 파일의 도구를 정확한 버전으로 설치
        run: python -m pip install -r packaging/requirements-package.txt

      - name: Package 만들기(작업 트리 확인·PyInstaller·자가 점검·결정적 zip·정보 파일·읽기 전용 검사)
        run: python packaging/build_package.py --out-dir "$env:RUNNER_TEMP/package"

      - name: SHA-256 보기(공개 값이다 — 운영자가 개인 PC 에서 대조한다)
        run: Get-Content "$env:RUNNER_TEMP/package/release/SHA256SUMS"

      # SHA 는 이 초안을 만든 PC 가 네트워크를 쓰지 않아 확인하지 못했다 — 승인 전에 릴리스 페이지의 값과 대조한다(v4.6.2).
      - name: 올리기(압축 파일·SHA256SUMS·PACKAGE_INFO 만, 14일)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ChanceBlogDesktop-preview
          path: |
            ${{ runner.temp }}/package/release/ChanceBlogDesktop-*-win64.zip
            ${{ runner.temp }}/package/release/SHA256SUMS
            ${{ runner.temp }}/package/release/PACKAGE_INFO.md
            ${{ runner.temp }}/package/release/PACKAGE_INFO.json
          retention-days: 14
          if-no-files-found: error
