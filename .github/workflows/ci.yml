name: "CI — 시험"

# 모든 브랜치 push 에서 시험을 돌린다(PR 을 만들 때는 다시 돌리지 않는다 — 아래 '미리 검사'). 시크릿·쓰기 권한을 쓰지 않는다(읽기 전용).
# 앱은 Windows 용이므로 Windows 에서도 돌리고, 코드는 Python 3.10 문법이어야 하므로 3.10 과 3.12 를 모두 돌린다.
# 미리 검사(D-28, 운영자 요청 2026-11-03): AI 가 병합할 브랜치를 push 하면 그 커밋의 시험이 곧바로 돌고, AI 는 네 칸이 모두 초록인 것을 확인한 뒤에만 병합을 부탁한다.
# 운영자가 PR 을 만들면 GitHub 가 같은 커밋의 이미 끝난 결과를 그대로 보여 주므로 기다릴 일이 없다. `pull_request` 를 켜 두면 PR 을 만들 때마다 같은 커밋을
# 13분 넘게 다시 돌려 운영자가 PR 화면 앞에서 기다리게 된다. PR 은 이 저장소 안의 브랜치에서만 만든다(포크 PR 은 받지 않는다).
# 어느 브랜치 push 든 검사되도록 `push` 에는 브랜치·경로·태그 필터를 달지 않는다(시험이 지킨다).
# 릴리스(설치 파일 빌드)는 이 워크플로가 아니라 따로 만든다(docs/RELEASE.md) — 서명·릴리스 변경은 T3.
# 액션은 전체 커밋 SHA 로 고정한다(docs/SECURITY.md §4, 시험이 지킨다). 갱신은 같은 메이저 안의 최신 태그를 확인해 SHA 와 끝의 버전 주석을 함께 바꾼다.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# 수동 실행(workflow_dispatch)이 같은 브랜치의 push 검사를 취소하지 않도록 묶음 이름에 이벤트 이름을 넣는다(D-28).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 시험 (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows 칸이 14~15분까지 늘었다(2026-11-03). 20분 한도에 닿아 빨간 칸이 나오면 병합 부탁이 막히므로 여유를 둔다(D-28, 시험이 지킨다).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: 시험 실행
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
