name: "[공통] 병합 부탁 PR 자동 만들기"

# 병합 부탁의 'PR 만들기' 단계를 대신한다. AI 가 병합할 브랜치(`ai/claude/M번호-이름`, main 위 커밋 한 개)를 push 하면, 이 워크플로가 그 커밋의 자동 검사(아래 CI_WORKFLOW 인 `ci.yml` —
# Windows·Ubuntu × 파이썬 3.10·3.12 네 칸, 약 21~29분 — D-176)가 모두 초록으로 끝나기를 기다렸다가 PR 을 만든다. PR 의 제목·본문은 그 커밋의 제목·본문 그대로다(운영자가 노란 배너로 만들 때와 같다).
# 운영자는 Pull requests 탭에서 `[M번호]` PR 을 열어 병합만 누르면 된다. 설명: docs/DECISIONS.md D-175, AGENTS.md 4(병합 부탁은 검사가 끝난 뒤에만 — D-28)
# **이 워크플로는 병합하지 않는다.** 병합·승인·라벨·코멘트·가지 삭제·설정 변경·다른 워크플로 실행도 하지 않는다(PR 만들기 한 가지). 시크릿도 쓰지 않는다.
#
# 규칙(docs/DECISIONS.md D-175, docs/SECURITY.md §4, tests/test_auto_pr_workflow.py 가 한 줄씩 고정한다 — 블로그 저장소 `chanceblog` 의 같은 이름 워크플로와 같은 규칙):
#  - 트리거는 push 하나, 가지는 `ai/claude/M###-*`·`ai/claude/M####-*` 뿐이다. `pull_request_target`·`workflow_run`·`issue_comment`·`schedule` 은 쓰지 않는다.
#  - 권한은 contents 읽기·pull-requests 쓰기·actions 읽기 셋뿐이다. 병합에는 contents 쓰기가 필요한데 주지 않는다.
#  - 외부 액션(`uses:`)이 없다(그래서 전체 커밋 SHA 고정 시험에 걸릴 것이 없다). 저장소를 내려받지도 가지의 코드를 실행하지도 않고, 러너에 설치된 `gh` 로 GitHub API 만 부른다.
#  - 가지 이름·커밋 제목·본문은 AI 가 쓴 글이다. 값은 모두 env 로만 넘기고 `run:` 안에는 `${{ }}` 를 끼우지 않으며, 셸이 글을 해석하지 않게 따옴표 친 변수·파일로만 다룬다.
#    로그·요약에는 고정된 짧은 문장과 PR 번호만 쓴다(제목·본문·API 응답 원문은 찍지 않는다).
#
# 알아 둘 것(한계):
#  - PR 을 만드는 조건은 여섯 가지가 모두 맞을 때다: ① 가지 이름이 `ai/claude/M번호-이름` ② 커밋 제목이 `[M번호] ` 로 시작 ③ 이 가지의 PR 이 아직 없음(닫힌 것·병합된 것 포함 — 기다린 뒤 PR 을 만들기 바로 앞에서 한 번 더 본다)
#    ④ 가지 끝이 아직 이 커밋 ⑤ 그 커밋의 `ci.yml` 이 성공(네 칸 모두 초록) ⑥ main 위에 이 커밋 한 개뿐(앞선 병합 전의 커밋이 끼어 있으면 앞 병합을 기다린다). 검사가 실패·취소되거나 가지에
#    새 커밋이 올라오면 PR 을 만들지 않고 끝낸다. PR 을 만들지 않고 끝나는 모든 경우도 실패(빨강)가 아니라 성공이고, 이유는 실행 요약과 경고 줄에 남는다.
#  - 기다리는 시간은 최대 40분이다(그 뒤에는 경고를 남기고 끝). `ci.yml` 은 한 칸이 최대 40분(`timeout-minutes`, D-176)이라 보통 그 안에 결과가 나온다(가장 느린 칸이 한도까지 걸리면 검사도 빨강이라 PR 이 필요 없다). 앞선 병합이 40분 안에 끝나지 않으면
#    이 실행은 PR 을 만들지 않으니 그때는 노란 배너로 만든다.
#  - 저장소 설정 'Allow GitHub Actions to create and approve pull requests' 가 꺼져 있으면 PR 을 만들 수 없다. 이때도 실패로 만들지 않고 경고로 켜는 곳을 알린 뒤 성공으로 끝낸다 —
#    그동안은 지금처럼 저장소 첫 화면의 노란 `Compare & pull request` 배너로 PR 을 만들면 된다.
#  - 이 저장소에는 `pull_request` 로 도는 워크플로가 없다(`ci.yml` 은 push·수동뿐, D-28). `GITHUB_TOKEN` 으로 만든 PR 은 `pull_request` 워크플로의 실행을 '승인 대기' 상태로 만들 수 있지만
#    (GitHub 공식 문서 'When GITHUB_TOKEN triggers workflow runs', `chanceblog` 저장소의 봇 PR 기록) 여기에는 만들어질 실행이 없어 PR 화면에는 push 때 이미 끝난 `ci.yml` 결과만 보인다.
#    `pull_request` 로 도는 워크플로를 더하면 이 줄을 다시 본다. PR 이 만들어지는 몇 초 동안은 이 워크플로 자신의 줄이 '도는 중'으로 보일 수 있다.
#  - PR 의 작성자는 `github-actions[bot]` 이다. squash 병합 커밋의 작성자도 운영자 이름이 아니라 봇으로 찍힐 수 있다(미관측 — 첫 병합에서 확인한다).
#  - push 로 도는 워크플로는 push 한 커밋에 있는 이 파일 그대로 돈다. 가지에 쓸 수 있는 사람만 그 가지의 이 파일을 바꿀 수 있고,
#    이 파일을 바꾸는 변경은 T3 로 다룬다(워크플로는 AGENTS.md 3 표에서는 T2 인데, 이 파일은 PR 만들기 권한과 저장소 설정 한 줄에 닿는 보안 영역이라 운영자 승인 병합으로 올린다).
#  - 커밋 제목·본문은 PR 의 제목·본문으로 **그대로 공개된다**. 비밀·키·개인 정보를 쓰지 말고 `@이름` 멘션도 쓰지 않는다(멘션은 그 사람에게 알림을 보낸다).
#  - PR 의 제목·본문은 **처음 push 때의 커밋 제목·본문**으로 정해진다. 그 뒤 같은 가지를 force-push 해 제목을 바꿔도 PR 이 이미 있으면 새 실행은 아무것도 하지 않아 PR 제목은 바뀌지 않는다(PR 화면에서 직접 고친다).
#  - 포크에서 올라오는 PR 에서는 돌지 않는다: 이 워크플로는 이 저장소의 가지 push 에서만 시작하고, 포크에서의 push 는 포크 자신의 저장소에서 돌아 이 저장소의 토큰·권한을 쓰지 못한다. 외부 기여 PR 은 사람이 만든다.
#  - 코드를 바꾸지 않고 알려 두는 한계: ① 첫 호출들(커밋 메시지 읽기·첫 기존 PR 확인)과 PR 만들기(POST)는 일시 오류에 다시 시도하지 않고 경고 뒤 성공으로 끝난다(노란 배너로 만든다)
#    ② 403 은 저장소 설정 꺼짐이 가장 흔해 그렇게 안내하지만 다른 원인(호출 한도 등)과 구별하지 않는다 ③ 마지막 기존 PR 확인과 PR 만들기 사이 몇 초에 가지에 새 커밋이 오면 앞 커밋의 제목으로 PR 이 만들어질 수 있다
#    (같은 가지의 새 push 가 앞 실행을 취소하므로 드물다) ④ 시험이 못 잡는 변경이 일부 남아 있다(독립 검증이 마지막 방어).

on:
  push:
    branches:
      - 'ai/claude/M[0-9][0-9][0-9]-*'
      - 'ai/claude/M[0-9][0-9][0-9][0-9]-*'

permissions:
  contents: read
  pull-requests: write
  actions: read

# 같은 가지에 다시 push 하면 앞선 기다림은 취소하고 새 커밋만 본다(가지마다 따로 줄을 세운다).
concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-pr:
    name: 검사가 초록이면 PR 만들기
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 병합 부탁 PR 만들기(병합은 하지 않음)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          BASE: ${{ github.event.repository.default_branch }}
          CI_WORKFLOW: ci.yml
          AUTOPR_POLL_SECONDS: '30'
          AUTOPR_MAX_WAIT_SECONDS: '2400'
        run: |
          set -euo pipefail
          # 글자 수 세기(`${#title}`)와 제어 문자 검사는 실행 환경의 로캘에 따라 글자 단위·바이트 단위로 달라진다(바이트로 세면 긴 한국어 제목이 '200자 초과'로 거절된다). 여기서 UTF-8 로 고정한다.
          export LC_ALL=C.UTF-8

          note() { echo "$*"; }
          warn() { echo "::warning::$*"; }
          summary() { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          # PR 을 만들지 않고 끝내는 모든 길. 실패(빨강)로 만들지 않고 이유를 요약에 남긴다.
          finish() {
            summary "- 결과: $1"
            exit 0
          }

          summary "### 병합 부탁 PR 자동 만들기"

          # 1) 입력 모양 확인 — env 로 받은 값도 쓰기 전에 모양부터 거른다(가지 이름은 AI 가 정한 글이다).
          re_repo='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          re_base='^[A-Za-z0-9._/-]{1,100}$'
          re_workflow='^[A-Za-z0-9._-]+\.ya?ml$'
          re_sha='^[0-9a-f]{40}$'
          re_zero='^0+$'
          re_branch='^ai/claude/(M[0-9]{3,4})-[A-Za-z0-9._-]{1,80}$'
          if [[ ! "$REPO" =~ $re_repo || ! "$BASE" =~ $re_base || ! "$CI_WORKFLOW" =~ $re_workflow || ! "$SHA" =~ $re_sha || "$SHA" =~ $re_zero ]]; then
            warn "저장소·기준 가지·검사 이름·커밋 값의 모양이 예상과 달라 PR 을 만들지 않습니다(삭제된 가지일 수도 있습니다)."
            finish "입력 값의 모양이 예상과 다름"
          fi
          if [[ ! "$BRANCH" =~ $re_branch ]]; then
            warn "가지 이름이 병합 가지 규칙(ai/claude/M번호-영문 이름)과 달라 PR 을 만들지 않습니다."
            finish "가지 이름이 병합 가지 규칙과 다름"
          fi
          num="${BASH_REMATCH[1]}"

          poll="${AUTOPR_POLL_SECONDS:-30}"
          limit="${AUTOPR_MAX_WAIT_SECONDS:-2400}"
          [[ "$poll" =~ ^[0-9]{1,4}$ ]] || poll=30
          [[ "$limit" =~ ^[0-9]{1,5}$ ]] || limit=2400

          # 2) 커밋 메시지 읽기: 첫 줄 = PR 제목(반드시 `[M번호] ` 로 시작), 나머지 = PR 본문. 글은 파일·변수로만 다루고 명령으로 실행하지 않는다.
          msg="${RUNNER_TEMP}/autopr-message.txt"
          lf="${RUNNER_TEMP}/autopr-message-lf.txt"
          body="${RUNNER_TEMP}/autopr-body.txt"
          err="${RUNNER_TEMP}/autopr-error.txt"
          if ! gh api "repos/${REPO}/git/commits/${SHA}" --jq .message > "$msg" 2>/dev/null; then
            warn "커밋 메시지를 읽지 못해 PR 을 만들지 않습니다(GitHub 응답 없음). 노란 배너로 만들어 주세요."
            finish "커밋 메시지를 읽지 못함"
          fi
          tr -d '\r' < "$msg" > "$lf"
          title="$(head -n 1 "$lf")"
          tail -n +2 "$lf" | awk 'NF { printing = 1 } printing' > "$body"
          prefix="[${num}] "
          if [[ "$title" != "$prefix"* ]]; then
            warn "커밋 제목이 [${num}] 로 시작하지 않아 PR 을 만들지 않습니다. 제목 맨 앞을 가지 이름의 번호와 같게 쓰세요."
            finish "커밋 제목이 가지 번호로 시작하지 않음"
          fi
          if [ "${#title}" -le "${#prefix}" ] || [ "${#title}" -gt 200 ] || [[ "$title" == *[[:cntrl:]]* ]]; then
            warn "커밋 제목이 비었거나 200자를 넘거나 제어 문자가 들어 있어 PR 을 만들지 않습니다."
            finish "커밋 제목이 PR 제목으로 쓸 수 없는 모양"
          fi
          if [ "$(wc -c < "$body")" -gt 60000 ]; then
            : > "$body"
            note "커밋 본문이 너무 길어 PR 본문은 비워 둡니다."
          fi

          # 3) 이 가지의 PR 이 이미 있으면(닫힌 것·병합된 것 포함) 다시 만들지 않는다. 확인하지 못하면 중복을 피하려고 만들지 않는다.
          #    기다리는 사이 운영자가 노란 배너로 직접 만들었을 수 있어 PR 을 만들기 바로 앞에서 한 번 더 확인한다(같은 함수).
          check_no_pr() {
            if ! existing="$(gh pr list --repo "$REPO" --head "$BRANCH" --state all --json number --jq length 2>/dev/null)" || [[ ! "$existing" =~ ^[0-9]+$ ]]; then
              warn "이 가지의 PR 이 이미 있는지 확인하지 못해 중복을 피하려고 PR 을 만들지 않습니다. 노란 배너로 만들어 주세요."
              finish "기존 PR 을 확인하지 못함"
            fi
            if [ "$existing" -gt 0 ]; then
              note "이 가지의 PR 이 이미 있어 새로 만들지 않습니다."
              finish "이 가지의 PR 이 이미 있음"
            fi
          }
          check_no_pr

          # 4) 기다리기(poll 초 간격, 최대 limit 초): 가지 끝이 아직 이 커밋이고, 검사가 성공으로 끝났고, main 위에 이 커밋 한 개뿐일 때만 다음으로 간다.
          runs_jq='(.workflow_runs[0].status // "none") + ":" + (.workflow_runs[0].conclusion // "none")'
          started=$SECONDS
          api_fails=0
          while true; do
            read_ok=1
            if ! head_now="$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --jq .object.sha 2>/dev/null)"; then
              read_ok=0
            elif [ "$head_now" != "$SHA" ]; then
              note "가지에 새 커밋이 올라와 이 실행은 그만둡니다(새 커밋의 실행이 이어받습니다)."
              finish "가지 끝이 바뀌어 그만둠"
            elif ! run_state="$(gh api "repos/${REPO}/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${SHA}&event=push&per_page=5" --jq "$runs_jq" 2>/dev/null)"; then
              read_ok=0
            else
              case "$run_state" in
                completed:success)
                  if ! ahead="$(gh api "repos/${REPO}/compare/${BASE}...${SHA}" --jq .ahead_by 2>/dev/null)" || [[ ! "$ahead" =~ ^[0-9]+$ ]]; then
                    read_ok=0
                  elif [ "$ahead" -eq 1 ]; then
                    break
                  elif [ "$ahead" -eq 0 ]; then
                    note "이 커밋은 이미 main 에 들어 있어 PR 을 만들지 않습니다."
                    finish "이미 main 에 들어 있음"
                  else
                    note "main 위에 이 커밋 말고 앞선 커밋이 더 있어(${ahead}개) 앞의 병합을 기다립니다."
                  fi
                  ;;
                completed:*)
                  warn "이 커밋의 검사가 성공으로 끝나지 않아 PR 을 만들지 않습니다."
                  finish "검사가 초록이 아님(실패·취소 등)"
                  ;;
                *)
                  note "검사가 아직 끝나지 않았습니다. 기다립니다."
                  ;;
              esac
            fi
            # 이번 바퀴에서 GitHub 응답을 읽지 못했으면 세고(연달아 다섯 번이면 그만둔다), 읽었으면 센 값을 지운다.
            if [ "$read_ok" -eq 1 ]; then
              api_fails=0
            else
              api_fails=$((api_fails + 1))
            fi
            if [ "$api_fails" -ge 5 ]; then
              warn "GitHub 응답을 연달아 읽지 못해 그만둡니다. 노란 배너로 PR 을 만들어 주세요."
              finish "GitHub 응답을 읽지 못해 그만둠"
            fi
            if [ $((SECONDS - started)) -ge "$limit" ]; then
              warn "기다리는 시간(최대 40분)이 지나 PR 을 만들지 않고 끝냅니다. 노란 배너로 만들어 주세요."
              finish "기다리는 시간이 지나 그만둠"
            fi
            sleep "$poll"
          done

          # 5) PR 만들기(병합 호출은 없다). 제목·본문은 따옴표 친 변수·파일로만 넘기고 -f 는 값을 글자 그대로 보낸다.
          check_no_pr
          if number="$(gh api -X POST "repos/${REPO}/pulls" -f "title=${title}" -f "head=${BRANCH}" -f "base=${BASE}" -F "body=@${body}" --jq .number 2> "$err")"; then
            if [[ "$number" =~ ^[0-9]{1,9}$ ]]; then
              note "PR #${number} 를 만들었습니다(병합은 하지 않습니다)."
              finish "PR #${number} 를 만들었습니다. 병합은 운영자가 합니다."
            fi
            note "PR 을 만들었지만 번호를 읽지 못했습니다."
            finish "PR 을 만들었습니다(번호는 읽지 못함). 병합은 운영자가 합니다."
          fi
          if grep -q -i -E 'not permitted to create or approve pull requests|\(HTTP 403\)' "$err"; then
            warn "권한 오류(403)로 PR 을 자동으로 만들지 못했습니다. 가장 흔한 원인은 저장소 설정이 꺼져 있는 것입니다. 켜는 곳: 저장소 Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests' 체크 → Save. 켜기 전에는 지금처럼 노란 'Compare & pull request' 배너로 PR 을 만들면 됩니다."
            finish "권한 오류(403)로 만들지 못함 — 저장소 설정(PR 만들기 허용)이 꺼져 있을 수 있음"
          fi
          if grep -q -i -E 'already exists' "$err"; then
            note "그사이 이 가지의 PR 이 만들어져 있어 새로 만들지 않습니다."
            finish "이 가지의 PR 이 이미 있음"
          fi
          warn "GitHub 가 PR 만들기를 받아 주지 않았습니다. 노란 배너로 PR 을 만들어 주세요."
          finish "PR 만들기를 GitHub 가 받아 주지 않음"
